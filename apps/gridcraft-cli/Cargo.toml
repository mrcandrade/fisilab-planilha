[package]
name = "gridcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FisiPlanilha command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false
default-run = "fisiplanilha-cli"

[lints]
workspace = true

# The executable is fisiplanilha-cli(.exe); the package keeps its upstream name.
[[bin]]
name = "fisiplanilha-cli"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages GridCraft writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }
